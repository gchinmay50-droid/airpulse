# AirPulse local infrastructure.
# Start:  docker compose up -d --build   Stop: docker compose down
# That single command runs EVERYTHING: broker, DB, Flink + jobs, producer, sink, API.
# Wipe:   docker compose down -v    (the -v deletes the data volume too)

services:

  # Redpanda = a Kafka-compatible broker in ONE binary, no ZooKeeper, no JVM.
  # Every Kafka client, tool and concept works unchanged against it.
  redpanda:
    restart: unless-stopped
    image: redpandadata/redpanda:v25.3.17
    container_name: airpulse-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container        # relaxes production checks for a laptop
      - --smp=1                     # one CPU core
      - --memory=1G
      - --overprovisioned           # tell it the CPU is shared, not dedicated
      - --node-id=0
      # THE classic Kafka networking gotcha, solved up front:
      # a client first connects, then the broker tells it "actually talk to me
      # at <advertised address>". If that address only resolves inside Docker,
      # clients on your laptop hang forever. So we run TWO listeners:
      #   internal  -> other containers reach it as  redpanda:9092
      #   external  -> your laptop reaches it as     localhost:19092
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # Kafka API, for producers/consumers running on the host
      - "9644:9644"     # admin API + Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data   # messages survive a restart
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Web UI to browse topics and read messages. Purely for our eyes.
  console:
    restart: unless-stopped
    image: redpandadata/console:v3.11.0
    container_name: airpulse-console
    environment:
      KAFKA_BROKERS: redpanda:9092      # inside Docker, so the INTERNAL listener
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # Validated readings land here. Postgres 16; same tool as project 1.
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: airpulse-postgres
    environment:
      POSTGRES_USER: airpulse
      POSTGRES_PASSWORD: airpulse      # local dev only; never reuse this pattern in prod
      POSTGRES_DB: airpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Any .sql in this folder runs ONCE, on first start, in filename order.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airpulse -d airpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Apache Flink: the stream processor. JobManager schedules, TaskManager runs.
  # Same custom image for both (Flink + connector JARs), built from flink/Dockerfile.
  flink-jobmanager:
    restart: unless-stopped
    build: ./flink
    container_name: airpulse-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"               # Flink web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    volumes:
      - ./flink/sql:/opt/flink/sql:ro     # our SQL jobs, submitted via sql-client
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  flink-taskmanager:
    restart: unless-stopped
    build: ./flink
    container_name: airpulse-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    depends_on:
      - flink-jobmanager

  # One-shot: submits every flink/sql/*.sql job, skipping ones already running.
  flink-submit:
    build: ./flink
    container_name: airpulse-flink-submit
    entrypoint: ["bash", "/opt/flink/submit.sh"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
      - ./flink/submit.sh:/opt/flink/submit.sh:ro
    depends_on:
      - flink-taskmanager
    restart: "no"

  # ---- Python services, one image (./Dockerfile), three commands ----
  producer:
    build: .
    container_name: airpulse-producer
    command: python -m src.producer --interval 600
    env_file: .env                    # DATAGOV_API_KEY lives here, never in git
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  sink:
    build: .
    container_name: airpulse-sink
    command: python -m src.sink
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      DATABASE_URL: postgresql://airpulse:airpulse@postgres:5432/airpulse
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    container_name: airpulse-api
    environment:
      DATABASE_URL: postgresql://airpulse:airpulse@postgres:5432/airpulse
    ports:
      - "8010:8010"                   # dashboard + /docs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
  postgres-data:
