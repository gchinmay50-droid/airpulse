name: CI

# Runs on every push and pull request. The validation rules are pure
# functions, so the suite needs no Kafka, no Postgres, no secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Validate docker-compose
        run: docker compose config --quiet
